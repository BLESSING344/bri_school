services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: bri_school
      DB_USERNAME: bri_school
      DB_PASSWORD: secret
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./public:/var/www/html/public
      - ./src:/var/www/html/src
      - ./db:/var/www/html/db

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bri_school
      POSTGRES_USER: bri_school
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bri_school -d bri_school"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
